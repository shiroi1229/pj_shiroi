name: ShiroiDualEngineProbe
options:
  bundleIdPrefix: com.shiroi1229
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  AppleStableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion.git
    revision: e12202c1f6405b83918b58a5d097cd61e3e1f702
  ShiroiMLXBridge:
    path: Packages/ShiroiMLXBridge
targets:
  ShiroiDualEngineProbe:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: AppleStableDiffusion
        product: StableDiffusion
      - package: ShiroiMLXBridge
        product: ShiroiMLXBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiroi1229.ShiroiDualEngineProbe
        PRODUCT_NAME: Shiroi Dual Engine Probe
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
