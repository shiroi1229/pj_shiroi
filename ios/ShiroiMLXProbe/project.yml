name: ShiroiMLXProbe
options:
  bundleIdPrefix: com.shiroi1229
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
packages:
  MLXStableDiffusionLocal:
    path: .generated/MLXStableDiffusionSource
  CoreMLStableDiffusionLocal:
    path: .generated/CoreMLStableDiffusionSource
targets:
  ShiroiMLXProbe:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MLXStableDiffusionLocal
        product: MLXStableDiffusion
      - package: CoreMLStableDiffusionLocal
        product: CoreMLStableDiffusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiroi1229.ShiroiMLXProbe
        PRODUCT_NAME: Shiroi MLX Probe
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
