name: iPad MLX Probe Build

on:
  pull_request:
    paths:
      - 'ios/ShiroiMLXProbe/**'
      - '.github/workflows/ipad-mlx-probe-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/ShiroiMLXProbe
        run: xcodegen generate
      - name: Resolve MLX packages
        working-directory: ios/ShiroiMLXProbe
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ShiroiMLXProbe.xcodeproj \
            -scheme ShiroiMLXProbe \
            -clonedSourcePackagesDirPath .build/SourcePackages
      - name: Patch upstream MLX examples iOS floor for probe
        working-directory: ios/ShiroiMLXProbe
        run: |
          MANIFEST=.build/SourcePackages/checkouts/mlx-swift-examples/Package.swift
          test -f "$MANIFEST"
          grep -q '\.iOS(\.v16)' "$MANIFEST"
          sed -i '' 's/\.iOS(\.v16)/.iOS(.v17)/g' "$MANIFEST"
          grep 'platforms:' "$MANIFEST"
      - name: Compile MLX probe for iOS device
        working-directory: ios/ShiroiMLXProbe
        run: |
          xcodebuild \
            -project ShiroiMLXProbe.xcodeproj \
            -scheme ShiroiMLXProbe \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build
