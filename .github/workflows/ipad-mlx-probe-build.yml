name: iPad MLX Probe Build

on:
  pull_request:
    paths:
      - 'ios/ShiroiMLXProbe/**'
      - '.github/workflows/ipad-mlx-probe-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare renamed MLX backend
        run: bash ios/ShiroiMLXProbe/prepare_mlx_backend.sh
      - name: Generate Xcode project
        working-directory: ios/ShiroiMLXProbe
        run: xcodegen generate
      - name: Resolve dual-engine packages
        working-directory: ios/ShiroiMLXProbe
        run: xcodebuild -resolvePackageDependencies -project ShiroiMLXProbe.xcodeproj -scheme ShiroiMLXProbe
      - name: Compile dual-engine probe for iOS device
        working-directory: ios/ShiroiMLXProbe
        run: xcodebuild -project ShiroiMLXProbe.xcodeproj -scheme ShiroiMLXProbe -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
