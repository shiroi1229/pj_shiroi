name: iPad Video Forge TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Explicitly upload a signed beta build to App Store Connect'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
concurrency:
  group: video-forge-testflight
  cancel-in-progress: false

jobs:
  signed-beta:
    if: github.ref == 'refs/heads/main' && inputs.upload_to_testflight
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select stable Xcode 26+ and verify SDK
        run: bash ios/ShiroiVideoForge/scripts/select_xcode.sh
      - name: Verify Apple signing inputs are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys
          names = ['APPLE_TEAM_ID','BUILD_CERTIFICATE_BASE64','P12_PASSWORD','BUILD_PROVISION_PROFILE_BASE64',
                   'APP_STORE_CONNECT_KEY_ID','APP_STORE_CONNECT_ISSUER_ID','APP_STORE_CONNECT_PRIVATE_KEY']
          missing = [k for k in names if not os.environ.get(k)]
          if missing:
              print('::error::Missing signing secret names: ' + ', '.join(missing)); sys.exit(1)
          print('Signing inputs present; validity will be checked by Apple tooling.')
          PY
      - name: Validate sources and prepare native project
        working-directory: ios/ShiroiVideoForge
        run: |
          set -euo pipefail
          swiftc -swift-version 5 Sources/GenerationRequest.swift Sources/ModelManifest.swift Tests/PreflightTests.swift -o "$RUNNER_TEMP/forge-preflight"
          "$RUNNER_TEMP/forge-preflight"
          python3 scripts/check_model_source.py
          python3 scripts/create_app_icon.py
          brew install xcodegen
          xcodegen generate
      - name: Sign and upload beta (not an App Store release)
        working-directory: ios/ShiroiVideoForge
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash scripts/release_testflight.sh
      # Signed binaries and credentials are intentionally NOT uploaded to this public repository.
